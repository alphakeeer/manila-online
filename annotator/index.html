<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manila Annotator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <div id="stage">
        <div id="board">
          <img
            id="board-img"
            src="../manila_assets/game_board.jpg"
            alt="Game board"
            draggable="false"
          />
        </div>
      </div>

      <aside class="panel">
        <h1>Manila Annotator</h1>

        <div class="canvas-tabs" role="tablist" aria-label="标注画布">
          <button class="canvas-tab active" type="button" data-canvas="board">Board</button>
          <button class="canvas-tab" type="button" data-canvas="share-1">Jade</button>
          <button class="canvas-tab" type="button" data-canvas="share-2">Nutmeg</button>
          <button class="canvas-tab" type="button" data-canvas="share-3">Silk</button>
          <button class="canvas-tab" type="button" data-canvas="share-4">Ginseng</button>
        </div>

        <p id="canvas-description" class="canvas-description">Board：可放置 Share 和 Player</p>

        <div class="row">
          <button id="btn-add-share" type="button">Add Share</button>
          <button id="btn-add-player" type="button">Add Player</button>
        </div>

        <p id="selected-type" class="selected-type">未选中</p>

        <div class="fields">
          <label>X <input id="input-x" type="number" step="0.1" disabled /></label>
          <label>Y <input id="input-y" type="number" step="0.1" disabled /></label>
          <label>Rotation <input id="input-rotation" type="number" step="0.1" disabled /></label>
          <label>Scale <input id="input-scale" type="number" step="0.01" min="0.01" disabled /></label>
        </div>

        <div class="row">
          <button id="btn-duplicate" type="button" disabled>Duplicate</button>
          <button id="btn-delete" type="button" disabled>Delete</button>
        </div>

        <hr />

        <div class="row">
          <button id="btn-export" type="button">Export JSON</button>
          <button id="btn-import" type="button">Import JSON</button>
        </div>
        <div class="row">
          <button id="btn-copy" type="button">Copy JSON</button>
          <button id="btn-clear" type="button">Clear</button>
        </div>

        <input id="file-import" type="file" accept="application/json,.json" hidden />

        <p class="hint">
          Arrow 1px · Shift+Arrow 10px<br />
          Q/E 1° · Shift+Q/E 5°<br />
          Delete · Ctrl/Cmd+D
        </p>
      </aside>
    </div>

    <script src="app.js"></script>
  </body>
</html>
